name: Build TriKey

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Detect signing key
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Restore signing key
        if: ${{ steps.signing.outputs.available == 'true' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/trikey.p12"
          echo "ANDROID_SIGNING_STORE_FILE=$RUNNER_TEMP/trikey.p12" >> "$GITHUB_ENV"
          echo "ANDROID_SIGNING_STORE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
          echo "ANDROID_SIGNING_KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}" >> "$GITHUB_ENV"
          echo "ANDROID_SIGNING_KEY_PASSWORD=${{ secrets.ANDROID_KEY_PASSWORD }}" >> "$GITHUB_ENV"

      - name: Test, lint, and build release APK
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:lintRelease :app:assembleRelease

      - name: Name APK
        id: package
        run: |
          AAPT="$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -1)"
          SOURCE="app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$SOURCE" ]; then
            SOURCE="app/build/outputs/apk/release/app-release-unsigned.apk"
          fi
          VERSION="$($AAPT dump badging "$SOURCE" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p" | head -1)"
          test -n "$VERSION"
          APK="app/build/outputs/apk/release/TriKey-v${VERSION}.apk"
          mv "$SOURCE" "$APK"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "apk=$APK" >> "$GITHUB_OUTPUT"

      - name: Verify APK signature
        if: ${{ steps.signing.outputs.available == 'true' }}
        run: |
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)"
          "$APKSIGNER" verify --verbose --print-certs "${{ steps.package.outputs.apk }}"

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: TriKey-v${{ steps.package.outputs.version }}
          path: ${{ steps.package.outputs.apk }}
          if-no-files-found: error

      - name: Publish GitHub Release
        if: ${{ startsWith(github.ref, 'refs/tags/v') && steps.signing.outputs.available == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.package.outputs.version }}
          APK: ${{ steps.package.outputs.apk }}
        run: |
          EXPECTED_TAG="v${VERSION}"
          if [ "$GITHUB_REF_NAME" != "$EXPECTED_TAG" ]; then
            echo "Tag $GITHUB_REF_NAME does not match APK version $EXPECTED_TAG" >&2
            exit 1
          fi
          gh release create "$EXPECTED_TAG" "$APK" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "TriKey $EXPECTED_TAG" \
            --generate-notes
